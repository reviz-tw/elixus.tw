<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elixus · 編輯室</title>
<link rel="stylesheet" href="/vendor/toastui-editor.min.css">
<link rel="stylesheet" href="/vendor/toastui-editor-dark.css">
<style>
  :root {
    --bg:#0a0c0e; --bg-soft:#101316; --surface:#14181c; --line:#1f262c;
    --fg:#b9bdc4; --fg-dim:#6c727b; --fg-faint:#444a52;
    --accent:#a8893f; --accent-dim:#7a6531;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Noto Serif TC","Songti TC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:var(--sans); display:flex; flex-direction:column; overflow:hidden; }

  header {
    display:flex; align-items:center; gap:1rem; padding:0.7rem 1.2rem;
    border-bottom:1px solid var(--line); background:var(--bg-soft); flex-shrink:0;
  }
  .brand { font-family:var(--mono); letter-spacing:0.25em; text-transform:uppercase;
    font-size:0.75rem; color:var(--accent); display:flex; align-items:center; gap:0.5rem; }
  .brand .dot { width:10px; height:10px; border:1.5px solid var(--accent); border-radius:50%; position:relative; }
  .brand .dot::after { content:""; position:absolute; inset:2.5px; background:var(--accent); border-radius:50%; }
  .badge { font-family:var(--mono); font-size:0.62rem; letter-spacing:0.1em; color:var(--fg-faint);
    border:1px solid var(--line); border-radius:999px; padding:0.15rem 0.6rem; }
  header .spacer { flex:1; }
  .status { font-family:var(--mono); font-size:0.7rem; color:var(--fg-dim); min-width:6rem; text-align:right; }

  button {
    font-family:var(--mono); font-size:0.72rem; letter-spacing:0.05em;
    background:var(--surface); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:0.4rem 0.9rem; cursor:pointer; transition:0.15s;
  }
  button:hover { border-color:var(--accent-dim); color:var(--accent); }
  button.primary { border-color:var(--accent-dim); color:var(--accent); }
  button.primary:hover { background:var(--accent); color:var(--bg); }

  .layout { flex:1; display:flex; min-height:0; }

  /* Sidebar */
  aside {
    width:240px; flex-shrink:0; border-right:1px solid var(--line);
    background:var(--bg-soft); display:flex; flex-direction:column; min-height:0;
  }
  aside .head { padding:0.8rem 1rem; font-family:var(--mono); font-size:0.66rem;
    letter-spacing:0.15em; text-transform:uppercase; color:var(--fg-faint);
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .post-list { overflow-y:auto; flex:1; }
  .post-row { padding:0.7rem 1rem; border-bottom:1px solid var(--line); cursor:pointer; }
  .post-row:hover { background:var(--surface); }
  .post-row.active { background:var(--surface); border-left:2px solid var(--accent); padding-left:calc(1rem - 2px); }
  .post-row .t { font-family:var(--serif); font-size:0.92rem; color:#cfd3d9; line-height:1.35; }
  .post-row .m { font-family:var(--mono); font-size:0.62rem; color:var(--fg-faint); margin-top:0.3rem; display:flex; gap:0.5rem; }
  .post-row .draft { color:var(--accent-dim); }

  /* Editor pane */
  .editor { flex:1; display:flex; flex-direction:column; min-width:0; }
  .meta { padding:0.9rem 1.2rem; border-bottom:1px solid var(--line); display:grid;
    grid-template-columns:1fr 1fr; gap:0.6rem 1rem; background:var(--bg-soft); }
  .meta .full { grid-column:1 / -1; }
  .field { display:flex; flex-direction:column; gap:0.25rem; }
  .field label { font-family:var(--mono); font-size:0.6rem; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--fg-faint); }
  .field input[type=text] {
    background:var(--surface); border:1px solid var(--line); border-radius:4px;
    color:var(--fg); padding:0.45rem 0.6rem; font-family:var(--serif); font-size:0.95rem;
  }
  .field input:focus { outline:none; border-color:var(--accent-dim); }
  .row-inline { display:flex; align-items:center; gap:1.2rem; }
  .check { display:flex; align-items:center; gap:0.4rem; font-family:var(--mono); font-size:0.72rem; color:var(--fg-dim); }
  .seg { font-family:var(--mono); font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent-dim); border-radius:999px; padding:0.2rem 0.7rem; }
  .post-group { padding:0.5rem 1rem 0.3rem; font-family:var(--mono); font-size:0.6rem;
    letter-spacing:0.16em; text-transform:uppercase; color:var(--fg-faint); }

  /* Toast UI Editor 佔滿剩餘空間 */
  #editor { flex:1; min-height:0; }
  .toastui-editor-defaultUI { border:none !important; }
  /* 收斂編輯器配色，貼近站台的黯金低調感 */
  .toastui-editor-dark .toastui-editor-defaultUI { background:var(--bg); }
  .toastui-editor-dark .toastui-editor-defaultUI-toolbar { background:var(--bg-soft); border-bottom:1px solid var(--line); }
  .toastui-editor-dark .toastui-editor-md-container,
  .toastui-editor-dark .toastui-editor-ww-container { background:var(--bg); }
  .toastui-editor-dark .ProseMirror { font-family:var(--serif); }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="dot"></span>Elixus</span>
  <span class="badge">編輯室 · 僅限本機</span>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <button id="btn-new-post">＋ 文章</button>
  <button id="btn-new-page">＋ 頁面</button>
  <button class="primary" id="btn-save">儲存 ⌘S</button>
</header>

<div class="layout">
  <aside>
    <div class="head"><span>內容</span><span id="count"></span></div>
    <div class="post-list" id="postlist"></div>
  </aside>

  <div class="editor">
    <div class="meta">
      <div class="field full row-inline">
        <span id="f-section-label" class="seg">文章 · posts/</span>
      </div>
      <div class="field full">
        <label>標題</label>
        <input type="text" id="f-title" placeholder="一個低調而誠實的標題">
      </div>
      <div class="field full">
        <label>副標</label>
        <input type="text" id="f-subtitle" placeholder="選填">
      </div>
      <div class="field full">
        <label>作者</label>
        <input type="text" id="f-author" placeholder="選填，例如：王小明">
      </div>
      <div class="field">
        <label>檔名 (slug，英文)</label>
        <input type="text" id="f-file" placeholder="cloud-feudalism">
      </div>
      <div class="field">
        <label>日期</label>
        <input type="text" id="f-date" placeholder="2026-06-17">
      </div>
      <div class="field full" id="wrap-tags">
        <label>標籤 (逗號分隔)</label>
        <input type="text" id="f-tags" placeholder="雲端封建, 資料自主">
      </div>
      <div class="field full row-inline" id="wrap-draft">
        <label class="check"><input type="checkbox" id="f-draft"> 草稿 (draft，不會發布)</label>
      </div>
    </div>
    <div id="editor"></div>
  </div>
</div>

<script src="/vendor/toastui-editor-all.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let current = null;          // {section, file} of the open file, null = new/unsaved
let curSection = 'posts';    // section the current draft will be saved into
const SECTION_LABEL = { posts: '文章 · posts/', pages: '頁面 · content/' };

// ---- Toast UI Editor (WYSIWYG, markdown-backed) ----
const editor = new toastui.Editor({
  el: $('#editor'),
  height: '100%',
  initialEditType: 'wysiwyg',
  previewStyle: 'tab',
  theme: 'dark',
  usageStatistics: false,   // 關閉 TUI 預設會送出的主機名統計 ping（資料自主）
  placeholder: '在此寫下你的筆記……貼上或拖曳圖片即可插入。',
  hooks: {
    addImageBlobHook: async (blob, callback) => {
      const fd = new FormData();
      fd.append('image', blob, blob.name || 'pasted.png');
      try {
        const r = await fetch('/api/upload', { method:'POST', body: fd });
        const d = await r.json();
        if (d.error) { setStatus('圖片上傳失敗: ' + d.error); return false; }
        callback(d.url, '');
      } catch (e) { setStatus('圖片上傳失敗: ' + e); }
      return false;
    }
  }
});

// 側邊欄標題用的 HTML 轉義
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 切換目前草稿所屬區段，連帶調整介面（頁面不需要標籤／草稿）
function applySection(section){
  curSection = section;
  $('#f-section-label').textContent = SECTION_LABEL[section] || section;
  const isPost = section === 'posts';
  $('#wrap-tags').style.display  = isPost ? '' : 'none';
  $('#wrap-draft').style.display = isPost ? '' : 'none';
}

// ---- API ----
async function loadList(){
  const r = await fetch('/api/posts'); const items = await r.json() || [];
  const list = $('#postlist'); list.innerHTML='';
  $('#count').textContent = items.length;
  let lastSection = null;
  items.forEach(p=>{
    if(p.section !== lastSection){
      const h=document.createElement('div');
      h.className='post-group';
      h.textContent = p.section==='pages' ? '頁面' : '文章';
      list.appendChild(h);
      lastSection = p.section;
    }
    const active = current && current.section===p.section && current.file===p.file;
    const row=document.createElement('div');
    row.className='post-row'+(active?' active':'');
    const tail = p.section==='posts' && p.draft ? '<span class="draft">草稿</span>' : '';
    const author = p.author ? '<span>'+esc(p.author)+'</span>' : '';
    row.innerHTML='<div class="t">'+esc(p.title||p.file)+'</div><div class="m"><span>'+(p.date||'')+'</span>'+author+tail+'</div>';
    row.onclick=()=>openPost(p.section, p.file);
    list.appendChild(row);
  });
}
async function openPost(section, file){
  const r=await fetch('/api/post?section='+encodeURIComponent(section)+'&file='+encodeURIComponent(file));
  const p=await r.json();
  if(p.error){ setStatus('讀取失敗: '+p.error); return; }
  current={section, file};
  applySection(section);
  $('#f-title').value=p.title||''; $('#f-subtitle').value=p.subtitle||''; $('#f-author').value=p.author||'';
  $('#f-file').value=file.replace(/\.md$/,''); $('#f-date').value=p.date||'';
  $('#f-tags').value=(p.tags||[]).join(', '); $('#f-draft').checked=!!p.draft;
  editor.setMarkdown(p.body||''); loadList(); setStatus('已開啟');
}
function newItem(section){
  current=null;
  applySection(section);
  $('#f-title').value=''; $('#f-subtitle').value=''; $('#f-author').value=''; $('#f-file').value='';
  $('#f-date').value=new Date().toISOString().slice(0,10);
  $('#f-tags').value=''; $('#f-draft').checked = section==='posts'; // 頁面預設發布
  editor.setMarkdown('');
  loadList(); $('#f-title').focus(); setStatus(section==='pages'?'新頁面':'新文章');
}
async function save(){
  const file=$('#f-file').value.trim();
  if(!file){ setStatus('請填檔名 slug'); $('#f-file').focus(); return; }
  const payload={
    section: curSection,
    file, title:$('#f-title').value.trim(), subtitle:$('#f-subtitle').value.trim(), author:$('#f-author').value.trim(),
    date:$('#f-date').value.trim(),
    draft: curSection==='posts' ? $('#f-draft').checked : false,
    tags: curSection==='posts' ? $('#f-tags').value.split(',').map(s=>s.trim()).filter(Boolean) : [],
    body: editor.getMarkdown(),
  };
  const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json();
  if(d.error){ setStatus('儲存失敗: '+d.error); return; }
  current={section:d.section, file:d.file}; setStatus('已儲存 ✓'); loadList();
}
let statusTimer;
function setStatus(s){ $('#status').textContent=s; clearTimeout(statusTimer); statusTimer=setTimeout(()=>$('#status').textContent='',3000); }

$('#btn-new-post').onclick=()=>newItem('posts');
$('#btn-new-page').onclick=()=>newItem('pages');
$('#btn-save').onclick=save;
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); save(); }});

loadList();
newItem('posts');
</script>
</body>
</html>
